<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stage decoration in Milwaukee, WI for weddings, engagements, birthdays and corporate events. Custom backdrops, floral arches, draping and lighting, set up at your venue. Call (414) 617-1267."
    />
    <meta name="theme-color" content="#FDFBF7" />

    <!-- Floral arch mark, from the brand logo -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The one address Google should index. Without this, a second
         domain pointing here reads as a duplicate site and the two
         split each other's ranking. -->
    <link rel="canonical" href="https://www.advancedstagedecoration.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.advancedstagedecoration.com/" />
    <meta
      property="og:title"
      content="Advanced Stage Decoration | Weddings &amp; Events in Milwaukee, WI"
    />
    <meta
      property="og:description"
      content="Floral arches, draped backdrops and warm lighting, designed around your colours and built in your Milwaukee venue."
    />
    <!-- Shared-link preview card: the logo on the site's ivory, drawn at
         1200x630. Opaque on purpose — chat apps composite a transparent
         PNG onto black, which would wreck the champagne-gold mark. JPEG
         because some scrapers still will not read WebP.
         Absolute, because Facebook and WhatsApp will not resolve a
         relative path. -->
    <meta
      property="og:image"
      content="https://www.advancedstagedecoration.com/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Advanced Stage Decoration — wedding and event decoration, Milwaukee WI"
    />
    <meta property="og:site_name" content="Advanced Stage Decoration" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Advanced Stage Decoration | Weddings &amp; Events in Milwaukee, WI"
    />
    <meta
      name="twitter:description"
      content="Floral arches, draped backdrops and warm lighting, designed around your colours and built in your Milwaukee venue."
    />
    <meta
      name="twitter:image"
      content="https://www.advancedstagedecoration.com/og-image.jpg"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <title>
      Advanced Stage Decoration | Wedding &amp; Event Stages in Milwaukee, WI
    </title>

    <!-- Local business details for Google. Keeps the phone, city and
         service area machine-readable for local search results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Advanced Stage Decoration",
        "description": "Stage and event decoration for weddings, engagements, birthdays and corporate events in Milwaukee, Wisconsin.",
        "telephone": "+1-414-617-1267",
        "url": "https://www.advancedstagedecoration.com",
        "image": "https://www.advancedstagedecoration.com/dec1.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Milwaukee",
          "addressRegion": "WI",
          "addressCountry": "US"
        },
        "areaServed": {
          "@type": "City",
          "name": "Milwaukee"
        },
        "knowsAbout": [
          "Wedding stage decoration",
          "Birthday party decoration",
          "Engagement stage decoration",
          "Draping and lighting"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
